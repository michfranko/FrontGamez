<div class="review-read-container">
  <div class="header-section">
    <h1>
      <span class="material-symbols-outlined header-icon">rate_review</span>
      <span>Mis Reseñas</span>
    </h1>
    <p class="subtitle">Consulta, edita y gestiona tus notas personales sobre los juegos de tu biblioteca.</p>
  </div>

  <!-- Buscador de Reseñas -->
  <div class="search-reviews-bar">
    <span class="material-symbols-outlined search-icon">search</span>
    <input type="text" class="search-input" placeholder="Buscar por título de videojuego..." [(ngModel)]="searchTerm" (input)="filterReviews()" />
  </div>

  <!-- Lista de Reseñas -->
  <div *ngIf="filteredReviews.length > 0" class="reviews-grid">
    <article *ngFor="let review of filteredReviews" class="review-card">
      <div class="review-card-header">
        <h3 class="game-title" (click)="goToGameDetail(review.id)">{{ review.nombre }}</h3>
        <div class="rating-badge">
          <span class="material-symbols-outlined star-icon">star</span>
          <span><b>{{ review.calificacion }}</b> / 10</span>
        </div>
      </div>

      <div class="review-body">
        <p class="review-text">"{{ review.texto }}"</p>
      </div>

      <div class="review-footer">
        <button (click)="goToGameDetail(review.id)" class="btn btn-detail">
          <span class="material-symbols-outlined">info</span>
          <span>Ver Ficha</span>
        </button>
        <button (click)="startEdit(review)" class="btn btn-edit">
          <span class="material-symbols-outlined">edit</span>
          <span>Editar</span>
        </button>
        <button (click)="deleteReview(review.id)" class="btn btn-delete">
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
    </article>
  </div>

  <!-- Modal de Edición -->
  <div class="modal-backdrop" *ngIf="editReviewId">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Editar Mi Reseña</h3>
        <button type="button" class="close-btn" (click)="cancelEdit()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form (ngSubmit)="saveEdit()" class="edit-form">
        <div class="form-group">
          <label>Calificación (0 - 10)</label>
          <input type="number" [(ngModel)]="editReview.calificacion" name="calificacion" min="0" max="10" step="0.5" class="form-input" required />
        </div>

        <div class="form-group">
          <label>Tu Análisis (hasta 1000 caracteres)</label>
          <textarea [(ngModel)]="editReview.texto" name="texto" rows="5" maxlength="1000" class="form-textarea" placeholder="Escribe aquí tu análisis..." required></textarea>
          <div class="char-count">{{ (editReview.texto || '').length }}/1000</div>
        </div>

        <div class="modal-actions">
          <button type="button" (click)="cancelEdit()" class="btn btn-cancel">Cancelar</button>
          <button type="submit" class="btn btn-save">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <app-empty-state
    *ngIf="filteredReviews.length === 0"
    icon="rate_review"
    title="No tienes reseñas registradas"
    message="Escribe opiniones y evaluaciones personales en las fichas de tus juegos completados."
  ></app-empty-state>
</div>
