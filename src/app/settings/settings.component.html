<div class="settings-container">
  <div class="header-section">
    <h2><span class="material-symbols-outlined header-icon">settings</span> {{ 'settings.title' | translate }}</h2>
    <p>{{ 'settings.description' | translate }}</p>
  </div>

  <div class="settings-grid">
    <section class="settings-card">
      <div class="card-header">
        <span class="material-symbols-outlined card-icon">tune</span>
        <h3>{{ 'settings.general' | translate }}</h3>
      </div>

      <div class="setting-item">
        <div class="item-text">
          <label>{{ 'settings.themeTitle' | translate }}</label>
          <span>{{ 'settings.themeDesc' | translate }}</span>
        </div>
        <select [(ngModel)]="settings.tema" (change)="updateSetting('tema', settings.tema)">
          <option value="system">{{ 'settings.themeOption.systemTitle' | translate }}</option>
          <option value="dark">{{ 'settings.themeOption.darkTitle' | translate }}</option>
          <option value="light">{{ 'settings.themeOption.lightTitle' | translate }}</option>
        </select>
      </div>

      <div class="setting-item">
        <div class="item-text">
          <label>{{ 'settings.languageTitle' | translate }}</label>
          <span>{{ 'settings.languageDesc' | translate }}</span>
        </div>
        <select [(ngModel)]="settings.idioma" (change)="updateSetting('idioma', settings.idioma)">
          <option value="es">{{ 'settings.language.option.es' | translate }}</option>
          <option value="en">{{ 'settings.language.option.en' | translate }}</option>
        </select>
      </div>

      <div class="setting-item">
        <div class="item-text">
          <label>{{ 'settings.currencyTitle' | translate }}</label>
          <span>{{ 'settings.currencyDesc' | translate }}</span>
        </div>
        <select [(ngModel)]="settings.moneda" (change)="updateSetting('moneda', settings.moneda)">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="MXN">MXN ($)</option>
          <option value="COP">COP ($)</option>
        </select>
      </div>

      <div class="setting-item">
        <div class="item-text">
          <label>{{ 'settings.dateFormatTitle' | translate }}</label>
          <span>{{ 'settings.dateFormatDesc' | translate }}</span>
        </div>
        <select [(ngModel)]="settings.formatoFecha" (change)="updateSetting('formatoFecha', settings.formatoFecha)">
          <option value="YYYY-MM-DD">YYYY-MM-DD</option>
          <option value="DD/MM/YYYY">DD/MM/YYYY</option>
        </select>
      </div>
    </section>
  </div>
</div>
