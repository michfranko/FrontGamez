<div [class.modal-backdrop]="isModal">
  <div [class.modal-content]="isModal" class="add-game-container">
    <div class="modal-header">
      <h2>+ Agregar Juego a tu Colección</h2>
      <button *ngIf="isModal" type="button" class="close-btn" (click)="onClose()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Advertencia de duplicado -->
    <div class="duplicate-banner" *ngIf="duplicateWarning">
      <span class="dup-header">
        <span class="material-symbols-outlined warn-icon">warning</span>
        <span>{{ duplicateWarning }}</span>
      </span>
      <p class="duplicate-hint">¿Deseas agregar otra edición o versión diferente de este juego?</p>
    </div>

    <!-- Formulario Personal -->
    <form (ngSubmit)="saveGame()" class="add-form">
      <div class="form-group">
        <label>Nombre del videojuego *</label>
        <input type="text" [(ngModel)]="game.nombre" name="nombre" class="form-input" required (input)="checkDuplicate()" />
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Año de lanzamiento</label>
          <input type="number" [(ngModel)]="game.anioLanzamiento" name="anioLanzamiento" class="form-input" />
        </div>

        <div class="form-group flex-1">
          <label>Prioridad</label>
          <select [(ngModel)]="game.prioridad" name="prioridad" class="form-select">
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>

        <div class="form-group flex-1">
          <label>Formato</label>
          <select [(ngModel)]="game.version" name="version" class="form-select">
            <option value="digital">Digital</option>
            <option value="fisico">Físico</option>
          </select>
        </div>
      </div>

      <app-platform-selector
        [selectedPlatform]="game.plataforma"
        (selectedPlatformChange)="onPlatformChange($event)"
      ></app-platform-selector>

      <app-status-selector
        [selectedStatus]="game.estado"
        (selectedStatusChange)="game.estado = $event"
      ></app-status-selector>

      <app-genre-selector
        [selectedGenres]="game.genres"
        (selectedGenresChange)="onGenreChange($event)"
      ></app-genre-selector>

      <div class="form-actions">
        <button type="button" class="btn btn-cancel" *ngIf="isModal" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn btn-save" [disabled]="!game.nombre || !game.plataforma">
          Guardar Juego en Biblioteca
        </button>
      </div>
    </form>
  </div>
</div>
