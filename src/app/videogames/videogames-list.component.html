<div class="library-container">
  <!-- Encabezado y Acción Principal -->
  <div class="library-header">
    <div class="title-group">
      <h1>
        <span class="material-symbols-outlined header-icon">sports_esports</span>
        <span>Mi Biblioteca de Videojuegos</span>
      </h1>
      <p class="subtitle">Gestiona tu colección, consulta tu progreso y decide qué jugar a continuación.</p>
    </div>
    <button class="btn btn-add-game" (click)="openAddModal()">
      <span class="material-symbols-outlined">add</span>
      <span>Agregar juego</span>
    </button>
  </div>

  <!-- Pestañas Superiores de Estado -->
  <div class="tabs-bar">
    <button class="tab-btn" [class.active]="activeTab === 'todos'" (click)="setTab('todos')">
      Todos <span class="tab-count">{{ allGames.length }}</span>
    </button>
    <button class="tab-btn" [class.active]="activeTab === 'jugando'" (click)="setTab('jugando')">
      <span class="material-symbols-outlined tab-icon playing-icon">play_circle</span>
      Jugando
    </button>
    <button class="tab-btn" [class.active]="activeTab === 'pendiente'" (click)="setTab('pendiente')">
      <span class="material-symbols-outlined tab-icon pending-icon">schedule</span>
      Pendientes
    </button>
    <button class="tab-btn" [class.active]="activeTab === 'terminado'" (click)="setTab('terminado')">
      <span class="material-symbols-outlined tab-icon done-icon">check_circle</span>
      Terminados
    </button>
    <button class="tab-btn" [class.active]="activeTab === 'favoritos'" (click)="setTab('favoritos')">
      <span class="material-symbols-outlined tab-icon fav-icon">favorite</span>
      Favoritos
    </button>
  </div>

  <!-- Barra de Búsqueda y Filtros -->
  <div class="filters-bar">
    <div class="search-box">
      <span class="material-symbols-outlined search-icon">search</span>
      <input
        type="text"
        class="search-input"
        placeholder="Buscar juego por título, plataforma o género..."
        [(ngModel)]="searchTerm"
        (input)="onSearchInput()"
      />
    </div>

    <div class="filter-controls">
      <select [(ngModel)]="platformFilter" (change)="applyFilters()" class="filter-select">
        <option value="">Plataforma: Todas</option>
        <option *ngFor="let p of availablePlatforms" [value]="p">{{ p }}</option>
      </select>

      <select [(ngModel)]="genreFilter" (change)="applyFilters()" class="filter-select">
        <option value="">Género: Todos</option>
        <option *ngFor="let g of availableGenres" [value]="g">{{ g }}</option>
      </select>

      <select [(ngModel)]="sortOption" (change)="applyFilters()" class="filter-select">
        <option value="fecha-reciente">Ordenar: Más recientes</option>
        <option value="fecha-antigua">Ordenar: Más antiguos</option>
        <option value="calificacion-desc">Ordenar: Mejor calificados</option>
        <option value="calificacion-asc">Ordenar: Menor calificación</option>
        <option value="nombre-asc">Ordenar: Alfabético (A-Z)</option>
        <option value="nombre-desc">Ordenar: Alfabético (Z-A)</option>
      </select>
    </div>
  </div>

  <!-- Contenido Asíncrono (Loading / Grid / Empty) -->
  <app-loading-state *ngIf="loading" message="Cargando biblioteca..."></app-loading-state>

  <div class="games-grid" *ngIf="!loading && filteredGames.length > 0">
    <app-game-card
      *ngFor="let g of filteredGames"
      [game]="g"
      (cardClick)="onGameClick($event)"
      (toggleFavorite)="onToggleFavorite($event)"
    ></app-game-card>
  </div>

  <app-empty-state
    *ngIf="!loading && filteredGames.length === 0"
    icon="sports_esports"
    title="No se encontraron videojuegos"
    message="No hay juegos que coincidan con los filtros seleccionados o tu biblioteca aún está vacía."
    actionLabel="+ Agregar primer juego"
    (action)="openAddModal()"
  ></app-empty-state>
</div>

<!-- Modal para agregar videojuego -->
<app-videogames-add
  *ngIf="showAddModal"
  [isModal]="true"
  (closeModal)="closeAddModal()"
  (gameAdded)="applyFilters()"
></app-videogames-add>
