<div class="wishlist-container">
  <div class="header-section">
    <h1>
      <span class="material-symbols-outlined header-icon">favorite</span>
      <span>Wishlist — Juegos por Comprar</span>
    </h1>
    <p class="subtitle">Guarda y organiza los videojuegos que planeas adquirir en el futuro.</p>
  </div>

  <!-- Formulario de adición -->
  <form (ngSubmit)="addItem()" class="wishlist-form">
    <h3>+ Agregar a Wishlist</h3>
    <div class="form-grid">
      <div class="form-group flex-2">
        <label>Nombre del videojuego *</label>
        <input type="text" [(ngModel)]="newItem.nombre" name="nombre" placeholder="Ej: Elden Ring..." required class="input-text" />
      </div>

      <div class="form-group flex-1">
        <label>Precio Estimado ($)</label>
        <input type="number" step="0.01" [(ngModel)]="newItem.precioBase" name="precioBase" placeholder="0.00" class="input-text" />
      </div>

      <div class="form-group flex-1">
        <label>Prioridad</label>
        <select [(ngModel)]="newItem.prioridad" name="prioridad" class="select-box">
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
    </div>

    <app-platform-selector
      [selectedPlatform]="newItem.plataforma || 'PC'"
      (selectedPlatformChange)="newItem.plataforma = $event"
    ></app-platform-selector>

    <div class="form-group">
      <label>Notas (opcional)</label>
      <input type="text" [(ngModel)]="newItem.notas" name="notas" placeholder="Ej: Esperar oferta de Steam en verano..." class="input-text" />
    </div>

    <button type="submit" [disabled]="!newItem.nombre" class="btn btn-add">
      + Agregar a Wishlist
    </button>
  </form>

  <!-- Lista de Elementos -->
  <div class="wishlist-grid" *ngIf="items.length > 0">
    <div *ngFor="let item of items" class="wish-card">
      <div class="card-header">
        <span class="platform-tag">{{ item.plataforma }}</span>
        <span class="priority-tag" [ngClass]="item.prioridad">{{ item.prioridad | titlecase }}</span>
      </div>

      <h3 class="game-name">{{ item.nombre }}</h3>
      <p class="notes" *ngIf="item.notas">
        <span class="material-symbols-outlined note-icon">lightbulb</span>
        <span>{{ item.notas }}</span>
      </p>

      <div class="card-footer">
        <div class="price-tag" *ngIf="item.precioBase">
          <span>{{ item.precioBase | currency:'USD' }}</span>
        </div>
        <div class="actions">
          <button (click)="moveToShopping(item)" class="btn btn-buy" title="Mover a Compras">
            <span class="material-symbols-outlined">shopping_cart</span>
            <span>Comprar</span>
          </button>
          <button (click)="deleteItem(item.id)" class="btn btn-delete" title="Eliminar">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <app-empty-state
    *ngIf="items.length === 0"
    icon="favorite"
    title="Tu Wishlist está vacía"
    message="Registra los juegos que te interesen para no olvidar comprarlos en tus próximas ofertas."
  ></app-empty-state>
</div>
